<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TestDev — a modern digital workspace.">
  <title>TestDev | Welcome</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#111c31; --accent:#48d6c6; --muted:#a9b7cc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif; color:#f4f8ff;
      background:radial-gradient(circle at 80% 15%,#183b50 0,transparent 34%),linear-gradient(135deg,#08101d,#101d34); }
    header { max-width:1120px; margin:auto; padding:28px 24px; display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:12px; color:#fff; text-decoration:none; font-size:21px; font-weight:800; letter-spacing:.4px; }
    .logo { width:44px; height:44px; display:block; }
    nav a { color:var(--muted); text-decoration:none; margin-left:25px; font-size:14px; }
    nav a:hover { color:var(--accent); }
    main { max-width:1120px; margin:auto; padding:90px 24px 110px; display:grid; grid-template-columns:1.2fr .8fr; gap:55px; align-items:center; }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; }
    h1 { margin:18px 0; max-width:650px; font-size:clamp(42px,6vw,72px); line-height:1.04; letter-spacing:-2px; }
    h1 span { color:var(--accent); }
    .intro { max-width:570px; color:var(--muted); font-size:18px; line-height:1.8; }
    .button { display:inline-block; margin-top:24px; padding:14px 22px; border-radius:9px; background:var(--accent); color:#06201f; text-decoration:none; font-weight:800; }
    .visual { min-height:300px; padding:28px; border:1px solid #29445b; border-radius:24px; background:linear-gradient(145deg,rgba(30,62,83,.8),rgba(14,25,44,.9)); box-shadow:0 24px 70px #0005; }
    .visual-mark { width:100%; height:230px; display:grid; place-items:center; }
    .visual-mark svg { width:190px; max-width:80%; filter:drop-shadow(0 12px 25px #48d6c655); }
    footer { border-top:1px solid #26364d; padding:24px; text-align:center; color:#8293aa; font-size:13px; }
    @media(max-width:760px) { header { padding:20px; } nav { display:none; } main { padding:65px 22px 80px; grid-template-columns:1fr; gap:35px; } .visual { min-height:250px; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="TestDev home">
      <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="TestDev logo">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48d6c6"/><stop offset="1" stop-color="#5b9cff"/></linearGradient></defs>
        <rect x="3" y="3" width="58" height="58" rx="17" fill="#172b40" stroke="#31536a"/>
        <path d="M18 20h28v7H36v21h-8V27h-10z" fill="url(#g)"/>
        <circle cx="46" cy="45" r="4" fill="#48d6c6"/>
      </svg>
      <span>TESTDEV</span>
    </a>
    <nav><a href="#home">Home</a><a href="#about">About</a></nav>
  </header>
  <main id="home">
    <section>
      <div class="eyebrow">Welcome to TestDev</div>
      <h1>Ideas into <span>digital</span> experiences.</h1>
      <p class="intro">A clean, modern starting point for the TestDev website. Build, explore, and bring your next project to life.</p>
      <a class="button" href="#about">Explore more</a>
    </section>
    <section class="visual" id="about" aria-label="TestDev brand graphic">
      <div class="visual-mark">
        <svg viewBox="0 0 220 220" role="img" aria-label="TestDev abstract logo">
          <defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48d6c6"/><stop offset="1" stop-color="#5b9cff"/></linearGradient></defs>
          <path d="M110 12 202 65v90l-92 53-92-53V65z" fill="#142b43" stroke="#31536a" stroke-width="3"/>
          <path d="M54 65h112v25h-42v75H96V90H54z" fill="url(#hero)"/>
          <circle cx="157" cy="151" r="12" fill="#48d6c6"/>
        </svg>
      </div>
    </section>
  </main>
  <footer>© <span id="year"></span> TestDev. All rights reserved.</footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
